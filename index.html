<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profi QR & Barcode Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #121212;
            color: white;
            margin: 0;
            padding: 20px;
        }

        h2 { margin-bottom: 10px; color: #00ff00; }

        /* Container für das Kamera-Fenster */
        #scanner-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            border: 3px solid #333;
            border-radius: 20px;
            overflow: hidden;
            background: #000;
        }

        #reader { width: 100%; }

        /* Visuelles Overlay (Fixier-Fenster) */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .focus-box {
            width: 260px;
            height: 180px; /* Rechteckig, gut für QR & Barcodes */
            border: 3px solid #00ff00;
            border-radius: 12px;
            box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .scan-line {
            position: absolute;
            width: 100%;
            height: 3px;
            background: #00ff00;
            box-shadow: 0 0 15px #00ff00;
            top: 0;
            animation: moveScan 2s linear infinite;
        }

        @keyframes moveScan {
            0% { top: 0%; }
            100% { top: 100%; }
        }

        /* Ergebnis-Box */
        #result-display {
            margin-top: 25px;
            padding: 20px;
            background: #222;
            border-radius: 15px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #output {
            display: block;
            margin-top: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #00ff00;
            word-wrap: break-word;
        }

        .status-info { color: #aaa; font-size: 0.9rem; }
    </style>
</head>
<body>

    <h2>Scanner Aktiv</h2>
    <p class="status-info">Ein Klick auf das Bild aktiviert den Ton</p>
    
    <div id="scanner-wrapper">
        <div id="reader"></div>
        <div class="overlay">
            <div class="focus-box">
                <div class="scan-line"></div>
            </div>
        </div>
    </div>

    <div id="result-display">
        <strong>Ergebnis:</strong>
        <span id="output">Warte auf Scan...</span>
    </div>

    <script>
        const html5QrCode = new Html5Qrcode("reader");
        let isPaused = false;

        // Maximal lauter Ton durch Wellen-Stacking
        function playExtremeBeep() {
            try {
                const context = new (window.AudioContext || window.webkitAudioContext)();
                const frequencies = [1000, 1005, 995]; 
                
                frequencies.forEach(freq => {
                    const osc = context.createOscillator();
                    const gain = context.createGain();

                    osc.type = "sawtooth"; // Aggressivste Wellenform
                    osc.frequency.setValueAtTime(freq, context.currentTime);
                    
                    gain.gain.setValueAtTime(0.6, context.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, context.currentTime + 0.5);

                    osc.connect(gain);
                    gain.connect(context.destination);

                    osc.start();
                    osc.stop(context.currentTime + 0.5);
                });
            } catch (e) {
                console.error("Audio Fehler:", e);
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            if (isPaused) return;

            // 1. Sperre für 5 Sekunden
            isPaused = true;
            
            // 2. Lauten Ton abspielen
            playExtremeBeep();

            // 3. Vibration (Handy)
            if (navigator.vibrate) navigator.vibrate(200);

            // 4. Anzeige & Countdown
            const output = document.getElementById('output');
            output.style.color = "#ff4444"; 
            
            let timeLeft = 5;
            const timer = setInterval(() => {
                output.innerText = `Code: ${decodedText} \n (Pause: ${timeLeft}s)`;
                timeLeft--;
                
                if (timeLeft < 0) {
                    clearInterval(timer);
                    isPaused = false;
                    output.innerText = "Bereit für nächsten Scan";
                    output.style.color = "#00ff00";
                }
            }, 1000);
        }

        const config = { 
            fps: 20, 
            qrbox: { width: 260, height: 180 },
            aspectRatio: 1.0 
        };

        // Kamera starten
        html5QrCode.start(
            { facingMode: "environment" }, 
            config, 
            onScanSuccess
        ).catch(err => {
            document.getElementById('output').innerText = "Kamera-Fehler: " + err;
        });
    </script>
</body>
</html>

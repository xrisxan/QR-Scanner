<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TimeTracker Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #scanner-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 3 / 4;
            background: black;
            margin: 0 auto;
        }
        #reader {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }
        .focus-box {
            width: 90%;           /* fast volle Breite */
            padding-bottom: 66%;  /* 3:2-Format – großzügig */
            border: 3px solid #00ff00;
            border-radius: 12px;
            box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        .scan-line {
            position: absolute;
            width: 100%;
            height: 3px;
            background: #00ff00;
            box-shadow: 0 0 15px #00ff00;
            top: 0;
            animation: scanMove 2s linear infinite;
        }
        @keyframes scanMove {
            0% { top: 0; }
            100% { top: 100%; }
        }
        .status {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="scanner-container">
        <div id="reader"></div>
        <div class="overlay">
            <div class="focus-box">
                <div class="scan-line"></div>
            </div>
        </div>
        <div class="status">QR-Code in die Mitte halten</div>
    </div>

    <script>
        const html5QrCode = new Html5Qrcode("reader");
        let processing = false;

        html5QrCode.start(
            { facingMode: "environment" },
            {
                fps: 15,
                qrbox: { width: 350, height: 350 }  // großer Suchbereich
            },
            (decodedText) => {
                if (processing) return;
                processing = true;
                // Kurze Bestätigung (optional)
                const statusDiv = document.querySelector('.status');
                statusDiv.innerText = "✅ Erfolg! Weiterleitung...";
                // Vollständige URL aus QR-Code öffnen
                window.location.href = decodedText;
            }
        ).catch(err => {
            console.error(err);
            document.querySelector('.status').innerText = "❌ Kamera-Fehler: " + err;
        });
    </script>
</body>
</html>

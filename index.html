<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TimeTracker Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #121212; color: white; margin: 0; padding: 20px; }
        h2 { margin-bottom: 10px; color: #00ff00; }
        #scanner-wrapper { position: relative; width: 100%; max-width: 500px; border: 3px solid #333; border-radius: 20px; overflow: hidden; background: #000; aspect-ratio: 3/4; }
        #reader { width: 100%; height: 100%; object-fit: cover; }
        .overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; align-items: center; pointer-events: none; z-index: 10; }
        .focus-box { width: 90%; aspect-ratio: 1 / 1; border: 3px solid #00ff00; border-radius: 12px; box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.6); position: relative; }
        .scan-line { position: absolute; width: 100%; height: 3px; background: #00ff00; box-shadow: 0 0 15px #00ff00; top: 0; animation: moveScan 2s linear infinite; }
        @keyframes moveScan { 0% { top: 0%; } 100% { top: 100%; } }
        #result-display { margin-top: 20px; padding: 15px; background: #222; border-radius: 15px; width: 100%; max-width: 500px; text-align: center; }
        #output { font-size: 1rem; font-weight: bold; color: #00ff00; word-wrap: break-word; }
        .status-info { color: #aaa; font-size: 0.9rem; }
    </style>
</head>
<body>
    <h2>⏱️ TimeTracker Scanner</h2>
    <p class="status-info">QR-Code mit Personalnummer vorhalten</p>
    <div id="scanner-wrapper">
        <div id="reader"></div>
        <div class="overlay"><div class="focus-box"><div class="scan-line"></div></div></div>
    </div>
    <div id="result-display"><strong>Status:</strong><br><span id="output">📷 Kamera wird gestartet...</span></div>

    <script>
        // 1. URL GENAU PRÜFEN (Kein Leerzeichen am Anfang!)
        const SERVER_URL = 'https://makeover-strep-segment.ngrok-free.dev';
        const BETRIEB_ID = '89a340a6-42fc-47a9-a39c-1d6b71877878';
        
        const html5QrCode = new Html5Qrcode("reader");
        let isProcessing = false;
        
        // Audio-Kontext einmalig initialisieren (Browser-Vorgabe)
        let audioCtx = null;
        
        async function onScanSuccess(decodedText) {
            if (isProcessing) return;
            isProcessing = true;
        
            // Beep & Vibration
            playBeep();
            if (navigator.vibrate) navigator.vibrate(200);
        
            const output = document.getElementById('output');
            output.innerText = "⏳ Verarbeite: " + decodedText;
            output.style.color = "#ffaa00";
        
            // WICHTIG: Wir hängen KEIN returnUrl an. 
            // Dadurch weiß dein C#-Server, dass er kein HTML senden soll.
            const url = `${SERVER_URL}/api/stempeln?b=${BETRIEB_ID}&p=${decodedText}`;
        
            try {
                const response = await fetch(url, {
                    method: 'GET',
                    mode: 'cors', 
                    headers: { 'ngrok-skip-browser-warning': 'true' } // Umgeht die ngrok-Warnseite
                });
        
                if (response.ok) {
                    output.innerText = "✅ Erfolgreich erfasst!";
                    output.style.color = "#00ff00";
                } else {
                    output.innerText = "⚠️ Server meldet Fehler (" + response.status + ")";
                    output.style.color = "#ff4444";
                }
            } catch (err) {
                console.error("Fetch Error:", err);
                output.innerText = "❌ Verbindung fehlgeschlagen";
                output.style.color = "#ff4444";
            } finally {
                // Die Kamera bleibt die ganze Zeit an! 
                // Wir warten nur 3 Sek, bis der nächste Mitarbeiter scannen darf.
                setTimeout(() => {
                    output.innerText = "📷 Bereit für nächsten Scan";
                    output.style.color = "#00ff00";
                    isProcessing = false;
                }, 3000);
            }
        }
        
        function playBeep() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } catch (e) { console.error(e); }
        }
        
        const config = { fps: 20, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 };
        
        html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
            .then(() => document.getElementById('output').innerHTML = "📷 Scanner aktiv.")
            .catch(err => document.getElementById('output').innerHTML = "❌ Fehler: " + err);
    </script>
</body>
</html>

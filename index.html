<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TimeTracker - Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #121212;
            color: white;
            margin: 0;
            padding: 20px;
        }

        h2 { margin-bottom: 10px; color: #00ff00; }

        #scanner-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 3 / 4;
        }

        #reader {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .focus-box {
            width: 90%;               /* fast volle Breite */
            height: auto;
            padding-bottom: 66%;      /* 3:2-Format – großzügig */
            border: 3px solid #00ff00;
            border-radius: 12px;
            box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .scan-line {
            position: absolute;
            width: 100%;
            height: 3px;
            background: #00ff00;
            box-shadow: 0 0 15px #00ff00;
            top: 0;
            animation: moveScan 2s linear infinite;
        }

        @keyframes moveScan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        #result-display {
            margin-top: 20px;
            padding: 15px;
            background: #222;
            border-radius: 15px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        #output {
            font-size: 1rem;
            font-weight: bold;
            color: #00ff00;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <h2>⏱️ TimeTracker - Zeiterfassung</h2>
    <p class="status-info">QR-Code in die Mitte halten – Kamera startet automatisch</p>

    <div id="scanner-wrapper">
        <div id="reader"></div>
        <div class="overlay">
            <div class="focus-box">
                <div class="scan-line"></div>
            </div>
        </div>
    </div>

    <div id="result-display">
        <strong>Status:</strong><br>
        <span id="output">📷 Kamera wird gestartet...</span>
    </div>

    <script>
        const html5QrCode = new Html5Qrcode("reader");
        let isProcessing = false;

        // Kurzer Piepton (optional)
        function playBeep() {
            try {
                const context = new (window.AudioContext || window.webkitAudioContext)();
                const osc = context.createOscillator();
                const gain = context.createGain();
                osc.type = "sawtooth";
                osc.frequency.setValueAtTime(1200, context.currentTime);
                gain.gain.setValueAtTime(0.5, context.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, context.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(context.destination);
                osc.start();
                osc.stop(context.currentTime + 0.3);
            } catch (e) {
                console.log("Beep nicht möglich", e);
            }
        }

        function onScanSuccess(decodedText) {
            if (isProcessing) return;
            isProcessing = true;

            playBeep();
            if (navigator.vibrate) navigator.vibrate(200);

            const output = document.getElementById('output');
            output.innerText = "✅ Erfolg! Leite weiter...";
            output.style.color = "#ffaa00";

            // QR-Code enthält die vollständige API-URL (mit Betriebs-ID und Personalnummer)
            window.location.href = decodedText;
        }

        const config = {
            fps: 15,
            qrbox: { width: 350, height: 350 },  // großer Suchbereich (angepasst an Fokus-Box)
            aspectRatio: 1.0
        };

        html5QrCode.start(
            { facingMode: "environment" },
            config,
            onScanSuccess
        ).then(() => {
            document.getElementById('output').innerHTML = "📷 Kamera läuft.<br>QR-Code vorhalten.";
        }).catch(err => {
            document.getElementById('output').innerHTML = "❌ Kamera-Fehler: " + err;
            console.error(err);
        });
    </script>
</body>
</html>

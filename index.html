<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profi QR & Barcode Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #121212;
            color: white;
            margin: 0;
            padding: 20px;
        }

        h2 { margin-bottom: 10px; color: #00ff00; }

        /* Container für das Kamera-Fenster */
        #scanner-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            border: 3px solid #333;
            border-radius: 20px;
            overflow: hidden;
            background: #000;
        }

        #reader { width: 100%; }

        /* Visuelles Overlay (Fixier-Fenster) – jetzt viel größer */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .focus-box {
            width: 90%;               /* fast volle Breite */
            aspect-ratio: 1 / 1;      /* quadratisch – perfekt für QR-Codes */
            border: 3px solid #00ff00;
            border-radius: 12px;
            box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .scan-line {
            position: absolute;
            width: 100%;
            height: 3px;
            background: #00ff00;
            box-shadow: 0 0 15px #00ff00;
            top: 0;
            animation: moveScan 2s linear infinite;
        }

        @keyframes moveScan {
            0% { top: 0%; }
            100% { top: 100%; }
        }

        /* Ergebnis-Box */
        #result-display {
            margin-top: 25px;
            padding: 20px;
            background: #222;
            border-radius: 15px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #output {
            display: block;
            margin-top: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #00ff00;
            word-wrap: break-word;
        }

        .status-info { color: #aaa; font-size: 0.9rem; }
    </style>
</head>
<body>

    <h2>Scanner Aktiv</h2>
    <p class="status-info">QR-Code in die Mitte halten – Kamera startet automatisch</p>
    
    <div id="scanner-wrapper">
        <div id="reader"></div>
        <div class="overlay">
            <div class="focus-box">
                <div class="scan-line"></div>
            </div>
        </div>
    </div>

    <div id="result-display">
        <strong>Ergebnis:</strong>
        <span id="output">Warte auf Scan...</span>
    </div>

    <script>
        // Falls du jemals QR-Codes mit NUR Personalnummer verwenden möchtest:
        const SERVER_URL = 'https://makeover-strep-segment.ngrok-free.dev -> https://localhost:7205';  // HIER DEINE NGROK-URL EINTRAGEN
        const BETRIEB_ID = '89a340a6-42fc-47a9-a39c-1d6b71877878';
        // Dann würde der Scanner die URL so zusammensetzen:
        // const url = `${SERVER_URL}/api/stempeln?b=${BETRIEB_ID}&p=${decodedText}`;
        // Dein QR-Code enthält aber bereits die vollständige URL – daher reicht decodedText.

        const html5QrCode = new Html5Qrcode("reader");
        let isProcessing = false;

        // Maximal lauter Ton (bleibt wie gehabt)
        function playExtremeBeep() {
            try {
                const context = new (window.AudioContext || window.webkitAudioContext)();
                const frequencies = [1000, 1005, 995]; 
                frequencies.forEach(freq => {
                    const osc = context.createOscillator();
                    const gain = context.createGain();
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(freq, context.currentTime);
                    gain.gain.setValueAtTime(0.6, context.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, context.currentTime + 0.5);
                    osc.connect(gain);
                    gain.connect(context.destination);
                    osc.start();
                    osc.stop(context.currentTime + 0.5);
                });
            } catch (e) {
                console.error("Audio Fehler:", e);
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            if (isProcessing) return;

            // Sofort sperren, damit nicht mehrfach ausgelöst wird
            isProcessing = true;
            
            // Lauter Ton + Vibration
            playExtremeBeep();
            if (navigator.vibrate) navigator.vibrate(200);

            // Kurze Bestätigung anzeigen
            const output = document.getElementById('output');
            output.innerText = "✅ Gescannt! Leite weiter...";
            output.style.color = "#ffaa00";

            // 🔥 WEITERLEITUNG ZUR API-URL (die vollständige URL steckt im QR-Code)
            window.location.href = decodedText;
        }

        const config = { 
            fps: 20, 
            qrbox: { width: 350, height: 350 },  // an das große Fokus-Fenster angepasst
            aspectRatio: 1.0 
        };

        // Kamera starten
        html5QrCode.start(
            { facingMode: "environment" }, 
            config, 
            onScanSuccess
        ).catch(err => {
            document.getElementById('output').innerText = "Kamera-Fehler: " + err;
        });
    </script>
</body>
</html>
